
name: Update Israel Railways timetable

on:
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build timetable
        run: python update_schedule.py

      - name: Commit timetable if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add schedule.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update public rail timetable'
            git push
          fi
